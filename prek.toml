[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "uv-lock", name = "uv lock", language = "system", entry = "uv lock --check", pass_filenames = false, files = "^(pyproject\\.toml|uv\\.lock)$" },
  { id = "ruff-check", name = "ruff check", language = "system", entry = "uv run ruff check .", pass_filenames = false, always_run = true },
  { id = "ruff-format", name = "ruff format", language = "system", entry = "uv run ruff format --check .", pass_filenames = false, always_run = true },
  { id = "pytest", name = "pytest", language = "system", entry = "uv run pytest -q", pass_filenames = false, always_run = true },
  { id = "compose-config", name = "docker compose config", language = "system", entry = "docker compose config --quiet", pass_filenames = false, files = "^(compose\\.yaml|deploy/.*\\.ya?ml)$" },
]
